<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://lofciwbtbwenjfjcualt.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_TeyZSK0_1Pq9JprNwtRYIQ_YEU8VKFT";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


function resize(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =========================================================
   CONFIGURACIÓN
========================================================= */

const WORLD = 5000;

const FOOD_TARGET = 600;

const MAX_BOTS = 40;

const BODY_GAP = 5;

const SEND_RATE = 50;


/* =========================================================
   ESTADO
========================================================= */

let running = false;

let paused = false;

let adminOpen = false;

let gameOver = false;

let playerId = null;

let channel = null;

let lastSend = 0;


/* =========================================================
   PLAYER
========================================================= */

const player = {

    id:null,

    name:"Player",

    color:"#42ff78",

    x:WORLD/2,

    y:WORLD/2,

    angle:0,

    score:20,

    alive:true,

    body:[]

};


/* =========================================================
   MULTIPLAYER
========================================================= */

const remotePlayers =
    new Map();


/* =========================================================
   BOTS
========================================================= */

const bots = [];


/* =========================================================
   FOOD
========================================================= */

const foods = [];


/* =========================================================
   INPUT
========================================================= */

const keys = {};

window.addEventListener(
    "keydown",
    e => {

        const key =
            e.key.toLowerCase();

        keys[key] = true;


        if(e.key === "F1"){

            e.preventDefault();

            adminOpen =
                !adminOpen;

            document.getElementById(
                "admin"
            ).style.display =
                adminOpen
                ? "block"
                : "none";

        }


        if(key === "p"){

            paused =
                !paused;

            updatePause();

        }

    }
);


window.addEventListener(
    "keyup",
    e => {

        keys[
            e.key.toLowerCase()
        ] = false;

    }
);


/* =========================================================
   UTILS
========================================================= */

function random(min,max){

    return Math.random() *
        (max-min)+min;

}


function distance(
    x1,
    y1,
    x2,
    y2
){

    return Math.hypot(
        x1-x2,
        y1-y2
    );

}


function randomColor(){

    const colors = [

        "#42ff78",
        "#4db5ff",
        "#ff536b",
        "#ff9b32",
        "#bd6cff",
        "#ff5cc8",
        "#44dfd0",
        "#eeee55"

    ];

    return colors[
        Math.floor(
            Math.random()*colors.length
        )
    ];

}


/* =========================================================
   BODY
========================================================= */

function createBody(worm){

    worm.body = [];

    const length =
        Math.floor(
            25 +
            worm.score * 2
        );

    for(
        let i=0;
        i<length;
        i++
    ){

        worm.body.push({

            x:
                worm.x -
                Math.cos(
                    worm.angle
                ) *
                i *
                BODY_GAP,

            y:
                worm.y -
                Math.sin(
                    worm.angle
                ) *
                i *
                BODY_GAP

        });

    }

}


/* =========================================================
   FOOD
========================================================= */

function createFood(
    x=null,
    y=null
){

    const type =
        Math.random();

    let value;
    let color;

    if(type < .78){

        value=1;
        color="#ffd52e";

    }
    else if(type < .95){

        value=3;
        color="#ff9638";

    }
    else{

        value=7;
        color="#4db5ff";

    }


    return {

        x:
            x === null
            ? random(30,WORLD-30)
            : x,

        y:
            y === null
            ? random(30,WORLD-30)
            : y,

        value,

        color

    };

}


function generateFood(){

    while(
        foods.length <
        FOOD_TARGET
    ){

        foods.push(
            createFood()
        );

    }

}


/* =========================================================
   BOTS
========================================================= */

function createBot(){

    const bot = {

        id:
            "bot-" +
            crypto.randomUUID(),

        name:
            "BOT_" +
            (bots.length+1),

        color:
            randomColor(),

        x:
            random(100,WORLD-100),

        y:
            random(100,WORLD-100),

        angle:
            random(
                0,
                Math.PI*2
            ),

        targetAngle:
            random(
                0,
                Math.PI*2
            ),

        score:
            Math.floor(
                random(10,80)
            ),

        alive:true,

        body:[],

        timer:0

    };

    createBody(bot);

    return bot;

}


function spawnBots(){

    while(
        bots.length <
        MAX_BOTS
    ){

        bots.push(
            createBot()
        );

    }

}


/* =========================================================
   BOT IA
========================================================= */

function updateBot(bot){

    if(!bot.alive)
        return;


    bot.timer--;


    if(bot.timer <= 0){

        bot.timer =
            Math.floor(
                random(30,90)
            );


        let closest=null;

        let best=1000;


        for(
            let i=0;
            i<60 &&
            foods.length;
            i++
        ){

            const food =
                foods[
                    Math.floor(
                        Math.random() *
                        foods.length
                    )
                ];


            const d =
                distance(
                    bot.x,
                    bot.y,
                    food.x,
                    food.y
                );


            if(d < best){

                best=d;
                closest=food;

            }

        }


        if(closest){

            bot.targetAngle =
                Math.atan2(
                    closest.y-bot.y,
                    closest.x-bot.x
                );

        }

    }


    /* Evitar bordes */

    const margin=350;


    if(bot.x < margin)
        bot.targetAngle=0;

    if(bot.x > WORLD-margin)
        bot.targetAngle=Math.PI;

    if(bot.y < margin)
        bot.targetAngle=Math.PI/2;

    if(bot.y > WORLD-margin)
        bot.targetAngle=-Math.PI/2;


    /* Evitar jugadores grandes */

    for(
        const other
        of remotePlayers.values()
    ){

        if(!other.alive)
            continue;


        const d =
            distance(
                bot.x,
                bot.y,
                other.x,
                other.y
            );


        if(
            d < 200 &&
            other.score >
            bot.score
        ){

            bot.targetAngle =
                Math.atan2(
                    bot.y-other.y,
                    bot.x-other.x
                );

        }

    }


    let diff =
        bot.targetAngle -
        bot.angle;


    while(diff > Math.PI)
        diff -= Math.PI*2;

    while(diff < -Math.PI)
        diff += Math.PI*2;


    bot.angle +=
        diff*.065;


    const speed =
        bot.score > 100
        ? 2.7
        : 3.2;


    bot.x +=
        Math.cos(bot.angle) *
        speed;

    bot.y +=
        Math.sin(bot.angle) *
        speed;


    bot.x =
        Math.max(
            20,
            Math.min(
                WORLD-20,
                bot.x
            )
        );


    bot.y =
        Math.max(
            20,
            Math.min(
                WORLD-20,
                bot.y
            )
        );


    bot.body.unshift({

        x:bot.x,
        y:bot.y

    });


    while(
        bot.body.length >
        25+bot.score*2
    ){

        bot.body.pop();

    }


    eatFood(bot);

}


/* =========================================================
   PLAYER
   SOLO WASD
========================================================= */

function updatePlayer(){

    let dx=0;
    let dy=0;


    if(keys["w"])
        dy--;

    if(keys["s"])
        dy++;

    if(keys["a"])
        dx--;

    if(keys["d"])
        dx++;


    /*
       Si hay WASD,
       la dirección sale exclusivamente
       del teclado.
    */

    if(dx !== 0 || dy !== 0){

        const target =
            Math.atan2(
                dy,
                dx
            );


        let diff =
            target-player.angle;


        while(diff > Math.PI)
            diff -= Math.PI*2;


        while(diff < -Math.PI)
            diff += Math.PI*2;


        player.angle +=
            diff*.16;

    }


    let speed=3.6;


    if(keys[" "]){

        if(player.score > 15){

            speed=7;

            if(
                Math.random() < .06
            ){

                player.score--;

            }

        }

    }


    player.x +=
        Math.cos(player.angle) *
        speed;

    player.y +=
        Math.sin(player.angle) *
        speed;


    player.x =
        Math.max(
            20,
            Math.min(
                WORLD-20,
                player.x
            )
        );


    player.y =
        Math.max(
            20,
            Math.min(
                WORLD-20,
                player.y
            )
        );


    player.body.unshift({

        x:player.x,
        y:player.y

    });


    while(
        player.body.length >
        25+player.score*2
    ){

        player.body.pop();

    }


    eatFood(player);

}


/* =========================================================
   COMER
========================================================= */

function eatFood(worm){

    for(
        let i=foods.length-1;
        i>=0;
        i--
    ){

        const food =
            foods[i];


        if(
            distance(
                worm.x,
                worm.y,
                food.x,
                food.y
            ) < 23
        ){

            worm.score +=
                food.value;

            foods.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   COLISIÓN REAL
=========================================================

   IMPORTANTE:

   cabeza -> cuerpo enemigo = muere cabeza

   Esto significa:

   BOT toca tu cola:
       BOT MUERE

   Tú tocas cola de BOT:
       TÚ MUERES

   Jugador toca cola de jugador:
       el jugador que tocó muere
========================================================= */

function killWorm(worm){

    if(!worm.alive)
        return;


    worm.alive=false;


    /*
       Convertir segmentos
       en comida.
    */

    if(worm.body){

        for(
            let i=0;
            i<worm.body.length;
            i+=5
        ){

            const p =
                worm.body[i];


            foods.push(
                createFood(
                    p.x,
                    p.y
                )
            );

        }

    }

}


/* =========================================================
   COLISIONES
========================================================= */

function checkCollisions(){

    const worms = [

        player,

        ...bots,

        ...Array.from(
            remotePlayers.values()
        )

    ];


    for(
        const attacker of worms
    ){

        if(!attacker.alive)
            continue;


        /*
           Solo comprobamos la cabeza
           del atacante.
        */

        for(
            const victim of worms
        ){

            if(attacker === victim)
                continue;

            if(!victim.alive)
                continue;


            /*
               Para evitar que la cabeza
               choque inmediatamente contra
               sus primeros segmentos.
            */

            const body =
                victim.body || [];


            const start =
                victim === attacker
                ? 12
                : 3;


            for(
                let i=start;
                i<body.length;
                i+=2
            ){

                const segment =
                    body[i];


                if(
                    distance(
                        attacker.x,
                        attacker.y,
                        segment.x,
                        segment.y
                    ) < 15
                ){

                    /*
                       EL QUE TOCÓ
                       ES EL QUE MUERE.
                    */

                    killWorm(
                        attacker
                    );


                    /*
                       Si era el jugador,
                       game over.
                    */

                    if(
                        attacker === player
                    ){

                        gameOver=true;

                        document.getElementById(
                            "finalScore"
                        ).textContent =
                            "Puntuación: " +
                            player.score;

                        document.getElementById(
                            "gameOver"
                        ).style.display =
                            "flex";

                    }


                    break;

                }

            }

        }

    }

}


/* =========================================================
   MULTIPLAYER
========================================================= */

async function connect(){

    playerId =
        crypto.randomUUID();

    player.id =
        playerId;


    channel =
        supabaseClient.channel(
            "worm-arena-online",
            {
                config:{
                    broadcast:{
                        self:false
                    }
                }
            }
        );


    /*
       RECIBIR JUGADORES
    */

    channel.on(
        "broadcast",
        {
            event:"player"
        },
        ({payload}) => {

            if(
                payload.id === playerId
            )
                return;


            /*
               Ahora recibimos
               TODO el cuerpo.
            */

            remotePlayers.set(
                payload.id,
                payload
            );

        }
    );


    /*
       RECIBIR ADMIN
    */

    channel.on(
        "broadcast",
        {
            event:"admin"
        },
        ({payload}) => {

            executeRemoteAdmin(
                payload
            );

        }
    );


    await channel.subscribe(
        status => {

            const element =
                document.getElementById(
                    "connection"
                );


            if(
                status ===
                "SUBSCRIBED"
            ){

                element.textContent =
                    "🟢 ONLINE • SUPABASE REALTIME";

                element.style.color =
                    "#42ff78";

            }
            else{

                element.textContent =
                    "Estado: " +
                    status;

            }

        }
    );

}


/* =========================================================
   ENVIAR JUGADOR
========================================================= */

async function sendPlayer(){

    if(!channel)
        return;


    const now =
        performance.now();


    if(
        now-lastSend <
        SEND_RATE
    )
        return;


    lastSend=now;


    await channel.send({

        type:"broadcast",

        event:"player",

        payload:{

            id:player.id,

            name:player.name,

            color:player.color,

            x:player.x,

            y:player.y,

            angle:player.angle,

            score:player.score,

            alive:player.alive,

            /*
               ESTO ARREGLA EL PROBLEMA
               DE LOS JUGADORES INVISIBLES.
            */

            body:player.body.map(
                p => ({
                    x:p.x,
                    y:p.y
                })
            )

        }

    });

}


/* =========================================================
   ADMIN ONLINE
========================================================= */

async function sendAdmin(
    action,
    data={}
){

    if(!channel)
        return;


    await channel.send({

        type:"broadcast",

        event:"admin",

        payload:{

            action,

            data

        }

    });


    /*
       El administrador también ejecuta
       el comando inmediatamente.
    */

    executeRemoteAdmin({

        action,

        data

    });

}


/* =========================================================
   EJECUTAR ADMIN
========================================================= */

function executeRemoteAdmin(
    command
){

    const action =
        command.action;


    /* +10 BOTS */

    if(
        action ===
        "addBots"
    ){

        const amount =
            command.data?.amount ||
            10;


        for(
            let i=0;
            i<amount;
            i++
        ){

            bots.push(
                createBot()
            );

        }

    }


    /* -10 BOTS */

    if(
        action ===
        "removeBots"
    ){

        const amount =
            command.data?.amount ||
            10;


        for(
            let i=0;
            i<amount &&
            bots.length;
            i++
        ){

            bots.pop();

        }

    }


    /* +100 FOOD */

    if(
        action ===
        "addFood"
    ){

        const amount =
            command.data?.amount ||
            100;


        for(
            let i=0;
            i<amount;
            i++
        ){

            foods.push(
                createFood()
            );

        }

    }


    /* CLEAR FOOD */

    if(
        action ===
        "clearFood"
    ){

        foods.length=0;

    }


    /* GROW */

    if(
        action ===
        "grow"
    ){

        player.score +=
            command.data?.amount ||
            100;

        createBody(
            player
        );

    }


    /* KILL BOT */

    if(
        action ===
        "killBot"
    ){

        const bot =
            bots.find(
                b => b.alive
            );


        if(bot)
            killWorm(bot);

    }


    /* REVIVE */

    if(
        action ===
        "revive"
    ){

        for(
            const bot of bots
        ){

            if(!bot.alive){

                bot.alive=true;

                bot.score =
                    Math.max(
                        bot.score,
                        20
                    );

                bot.x =
                    random(
                        100,
                        WORLD-100
                    );

                bot.y =
                    random(
                        100,
                        WORLD-100
                    );

                createBody(
                    bot
                );

            }

        }

    }


    /* RESET */

    if(
        action ===
        "reset"
    ){

        resetWorld();

    }


    /* PAUSE */

    if(
        action ===
        "pause"
    ){

        paused=true;

        updatePause();

    }


    /* RESUME */

    if(
        action ===
        "resume"
    ){

        paused=false;

        updatePause();

    }


    document.getElementById(
        "adminStatus"
    ).textContent =
        "Comando online: " +
        action;

}

/* =========================================================
   CÁMARA
========================================================= */

function getCamera(){

    let x =
        player.x -
        canvas.width/2;


    let y =
        player.y -
        canvas.height/2;


    x =
        Math.max(
            0,
            Math.min(
                WORLD-canvas.width,
                x
            )
        );


    y =
        Math.max(
            0,
            Math.min(
                WORLD-canvas.height,
                y
            )
        );


    return {
        x,
        y
    };

}


/* =========================================================
   GRID
========================================================= */

function drawGrid(cam){

    ctx.fillStyle =
        "#070a12";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const grid=100;


    ctx.strokeStyle =
        "#121b2b";


    const startX =
        Math.floor(
            cam.x/grid
        )*grid;


    const startY =
        Math.floor(
            cam.y/grid
        )*grid;


    for(
        let x=startX;
        x<cam.x+canvas.width+grid;
        x+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(
            x-cam.x,
            0
        );

        ctx.lineTo(
            x-cam.x,
            canvas.height
        );

        ctx.stroke();

    }


    for(
        let y=startY;
        y<cam.y+canvas.height+grid;
        y+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(
            0,
            y-cam.y
        );

        ctx.lineTo(
            canvas.width,
            y-cam.y
        );

        ctx.stroke();

    }

}


/* =========================================================
   DIBUJAR GUSANO
========================================================= */

function drawWorm(
    worm,
    cam
){

    if(!worm.alive)
        return;


    const body =
        worm.body || [];


    /*
       CUERPO COMPLETO
    */

    for(
        let i=body.length-1;
        i>=0;
        i--
    ){

        const p =
            body[i];


        const x =
            p.x-cam.x;

        const y =
            p.y-cam.y;


        if(
            x < -30 ||
            x > canvas.width+30 ||
            y < -30 ||
            y > canvas.height+30
        )
            continue;


        ctx.fillStyle =
            worm.color;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            i===0
                ? 14
                : 10,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /*
       CABEZA
    */

    const hx =
        worm.x-cam.x;

    const hy =
        worm.y-cam.y;


    const px =
        -Math.sin(
            worm.angle
        );

    const py =
        Math.cos(
            worm.angle
        );


    for(
        const side of [-1,1]
    ){

        const ex =
            hx +
            Math.cos(
                worm.angle
            )*7 +
            px*6*side;


        const ey =
            hy +
            Math.sin(
                worm.angle
            )*7 +
            py*6*side;


        ctx.fillStyle =
            "white";


        ctx.beginPath();

        ctx.arc(
            ex,
            ey,
            4,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle =
            "#000";


        ctx.beginPath();

        ctx.arc(
            ex,
            ey,
            2,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /*
       NOMBRE
    */

    ctx.font =
        "12px Arial";

    ctx.textAlign =
        "center";

    ctx.fillStyle =
        "rgba(255,255,255,.75)";


    ctx.fillText(
        worm.name,
        hx,
        hy-24
    );

}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    const cam =
        getCamera();


    drawGrid(cam);


    /*
       FOOD
    */

    for(
        const food of foods
    ){

        const x =
            food.x-cam.x;

        const y =
            food.y-cam.y;


        if(
            x < -20 ||
            x > canvas.width+20 ||
            y < -20 ||
            y > canvas.height+20
        )
            continue;


        ctx.fillStyle =
            food.color;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            food.value >= 7
                ? 8
                : food.value >= 3
                ? 7
                : 5,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /*
       BOTS
    */

    for(
        const bot of bots
    ){

        drawWorm(
            bot,
            cam
        );

    }


    /*
       JUGADORES ONLINE
    */

    for(
        const remote
        of remotePlayers.values()
    ){

        drawWorm(
            remote,
            cam
        );

    }


    /*
       PLAYER
    */

    drawWorm(
        player,
        cam
    );

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    document.getElementById(
        "score"
    ).textContent =
        player.score;


    document.getElementById(
        "length"
    ).textContent =
        player.body.length;


    document.getElementById(
        "players"
    ).textContent =
        remotePlayers.size+1;


    document.getElementById(
        "adminBots"
    ).textContent =
        bots.length;


    document.getElementById(
        "adminFood"
    ).textContent =
        foods.length;


    document.getElementById(
        "adminPlayers"
    ).textContent =
        remotePlayers.size+1;


    const ranking = [

        player,

        ...bots,

        ...Array.from(
            remotePlayers.values()
        )

    ]
    .filter(
        w => w.alive
    )
    .sort(
        (a,b) =>
            b.score-a.score
    );


    const list =
        document.getElementById(
            "rankingList"
        );


    list.innerHTML="";


    ranking
        .slice(0,8)
        .forEach(
            (worm,i) => {

                const row =
                    document.createElement(
                        "div"
                    );


                row.className="rank";


                row.innerHTML =
                    `
                    <span>
                        ${i+1}. ${worm.name}
                    </span>

                    <b>
                        ${worm.score}
                    </b>
                    `;


                list.appendChild(
                    row
                );

            }
        );

}

document.getElementById(

).onclick = async () => {

        "Player";


    document.getElementById(
        "menu"
    ).style.display =

    createBody(
        player
    );


    generateFood();

    spawnBots();


    await connect();


    running=true;

};


/* =========================================================
   LOOP
========================================================= */

function loop(){

    requestAnimationFrame(
        loop
    );


    if(!running){

        draw();

        return;

    }


    if(
        !paused &&
        !adminOpen &&
        !gameOver
    ){

        updatePlayer();


        for(
            const bot of bots
        ){

            updateBot(
                bot
            );

        }


        /*
           Primero movimiento.
           Después colisiones.
        */

        checkCollisions();


        generateFood();


        sendPlayer();

    }


    draw();

    updateHUD();

}


loop();
